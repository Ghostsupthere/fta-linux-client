[package]
name = "fta-launcher"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility", "unstable-winit-030"] }

png = { version = "0.18", optional = true }

[features]
# Development only: FTA_LAUNCHER_SNAPSHOT=out.png renders the window to a file and exits.
dev-snapshot = ["dep:png"]

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
